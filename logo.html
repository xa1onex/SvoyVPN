<!DOCTYPE html><html><body style="background: black; padding: 50px;">
<svg width="200" height="200" viewBox="0 0 100 100" fill="none" class="knot">
  <style>
    .knot { stroke: white; }
    .bg-stroke { stroke: black; stroke-width: 18; }
    .fg-stroke { stroke: white; stroke-width: 10; }
  </style>

  <!-- We draw two pill shapes. One is rotated 45, the other -45.
       pill shape: <rect x="20" y="35" width="60" height="30" rx="15" />
       Wait, the user attached a thin curvy X. Let us use paths.
  -->
  <g transform="translate(50,50) rotate(45) translate(-50,-50)">
    <rect x="20" y="36" width="60" height="28" rx="14" class="bg-stroke" />
    <rect x="20" y="36" width="60" height="28" rx="14" class="fg-stroke" />
  </g>
  <g transform="translate(50,50) rotate(-45) translate(-50,-50)">
    <!-- the middle section needs to go UP / OVER the other pill. 
         We can do this by drawing ONLY the middle section of the second pill.
    -->
    <rect x="20" y="36" width="60" height="28" rx="14" class="bg-stroke" />
    <rect x="20" y="36" width="60" height="28" rx="14" class="fg-stroke" />
    
    <!-- draw the middle of Pill 1 again to make it OVER Pill 2 -->
  </g>
</svg>
</body></html>
