# Пример конфигурации nginx для проксирования запросов /sub/ на веб-сервер бота
# Скопируйте этот блок в ваш конфиг nginx для домена xdoublegroup.online

server {
    listen 443 ssl http2;
    server_name xdoublegroup.online;
    
    # SSL сертификаты (настройте свои)
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/key.pem;
    
    # Проксирование запросов /sub/ на веб-сервер бота (порт 8080)
    location /sub/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Важно: не добавлять слэш в конце proxy_pass, чтобы сохранить путь /sub/
        # proxy_pass http://127.0.0.1:8080/;  ❌ НЕПРАВИЛЬНО
        # proxy_pass http://127.0.0.1:8080;   ✅ ПРАВИЛЬНО
    }
    
    # Проксирование вебхуков (опционально)
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Остальные запросы обрабатываются вашим основным сайтом
    location / {
        # Ваша основная конфигурация сайта
        root /var/www/html;
        index index.html;
        # или proxy_pass на другой сервер
    }
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name xdoublegroup.online;
    return 301 https://$server_name$request_uri;
}
