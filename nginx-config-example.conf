# Пример конфигурации nginx для проксирования запросов /sub/ на веб-сервер бота
# Скопируйте этот блок в ваш конфиг nginx для домена xdoublegroup.online

server {
    listen 443 ssl http2;
    server_name xdoublegroup.online;

    # Для статики SvoyVPN-Web задайте каталог, где лежат index.html и need/ (нужно для блока иконок ниже).
    # root /root/SvoyVPN/SvoyVPN-Web;
    
    # SSL сертификаты (настройте свои)
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/key.pem;
    
    # Проксирование запросов /sub/ на веб-сервер бота (порт 8080)
    location /sub/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON профили (Happ / Xray)
    location /profile/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deep link маршруты для автоматического подключения приложений
    location ~ ^/(apple|android|windows|mac)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование вебхуков
    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование всех API запросов
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Иконки: без долгого кэша (иначе при открытии /need/favicon.ico видна старая картинка).
    # Раскомментируйте и выставьте root выше на SvoyVPN-Web, либо замените путь в root здесь:
    #location ~* ^/need/(favicon-svoy\.ico|favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png)$ {
    #    root /root/SvoyVPN/SvoyVPN-Web;
    #    add_header Cache-Control "no-store, no-cache, must-revalidate";
    #    add_header Pragma "no-cache";
    #    expires off;
    #}
    
    # Остальные запросы обрабатываются вашим основным сайтом
    location / {
        # Ваша основная конфигурация сайта
        root /var/www/html;
        index index.html;
        # или proxy_pass на другой сервер
    }
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name xdoublegroup.online;
    return 301 https://$server_name$request_uri;
}
