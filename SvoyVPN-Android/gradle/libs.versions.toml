[versions]
agp = "8.5.2"
kotlin = "2.0.0"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.4"
activity = "1.9.1"
fragment = "1.8.2"
appcompat = "1.7.0"
biometric = "1.2.0-alpha05"
workManager = "2.9.1"
securityCrypto = "1.1.0-alpha06"
googleServicesVersion = "4.4.2"
firebaseBom = "33.2.0"
glanceAppwidget = "1.1.0"
composeBom = "2024.06.00"
retrofit = "2.11.0"
okhttp = "4.12.0"
coil = "2.7.0"

[libraries]
androidx-core-ktx        = { group = "androidx.core",          name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity        = { group = "androidx.activity",       name = "activity-ktx",          version.ref = "activity" }
androidx-fragment        = { group = "androidx.fragment",       name = "fragment-ktx",          version.ref = "fragment" }
appcompat                = { group = "androidx.appcompat",      name = "appcompat",             version.ref = "appcompat" }
biometric                = { group = "androidx.biometric",      name = "biometric",             version.ref = "biometric" }
work-runtime             = { group = "androidx.work",           name = "work-runtime-ktx",      version.ref = "workManager" }
security-crypto          = { group = "androidx.security",       name = "security-crypto",       version.ref = "securityCrypto" }
firebase-bom             = { group = "com.google.firebase",     name = "firebase-bom",          version.ref = "firebaseBom" }
firebase-messaging       = { group = "com.google.firebase",     name = "firebase-messaging-ktx" }
glance-appwidget         = { group = "androidx.glance",         name = "glance-appwidget",      version.ref = "glanceAppwidget" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }

retrofit                = { group = "com.squareup.retrofit2", name = "retrofit",            version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson",      version.ref = "retrofit" }
okhttp                  = { group = "com.squareup.okhttp3",   name = "okhttp",              version.ref = "okhttp" }
okhttp-logging          = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

coil-compose            = { group = "io.coil-kt",             name = "coil-compose",        version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services", version.ref = "googleServicesVersion" }
