# Пример: только статика SvoyVPN-Web на https://svoygroup.online + прокси API на бота.
# Скопируйте в /etc/nginx/sites-available/ и подставьте ssl_certificate, пути root, server_name.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name svoygroup.online www.svoygroup.online;

    ssl_certificate     /etc/letsencrypt/live/svoygroup.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/svoygroup.online/privkey.pem;

    # Каталог с index.html и need/ (НЕ родитель репозитория без SvoyVPN-Web)
    root /root/SvoyVPN/SvoyVPN-Web;
    index index.html;

    # API и подписки — на Python (порт как в bot/.env).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API и подписки — на Python. Если Happ Desktop не видит hide-settings / providerid,
    # проверьте, что перед nginx нет CDN, который вырезает нестандартные заголовки ответа.
    location /sub/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON профили (Happ / Xray)
    location /profile/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deep link маршруты (Happ: /…/happ/… = нативная JSON-подписка, как /sub с UA Happ)
    location ~ ^/(apple|android|windows|mac)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Дашборд: /app → /app.html (SPA-оболочка)
    location = /app {
        rewrite ^ /app.html last;
    }

    # ВАЖНО: до location /. Если файла нет, должен быть 404, а не index.html.
    # Иначе curl /need/favicon-svoy.ico покажет content-type: text/html и размер как у index.html.
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?|woff|ttf|eot|css|js|map)$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name svoygroup.online www.svoygroup.online;
    return 301 https://$host$request_uri;
}
