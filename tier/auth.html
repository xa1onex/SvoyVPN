<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SvoyVPN - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Manrope',sans-serif;
    background:#040404;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

/* GRID */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
}

/* GREEN GLOW */

body::after{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 15% 20%,
    rgba(0,255,132,.15),
    transparent 35%),
    radial-gradient(circle at 90% 80%,
    rgba(0,100,255,.08),
    transparent 40%);
    pointer-events:none;
}

.wrapper{
    position:relative;
    z-index:2;
    display:flex;
    min-height:100vh;
}

/* LEFT */

.left{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:80px;
}

.logo{
    position:absolute;
    top:40px;
    left:60px;
    font-size:32px;
    font-weight:800;
}

.logo span{
    color:#00ff84;
}

.badge{
    width:max-content;
    padding:12px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.02);
    margin-bottom:30px;
}

.badge::before{
    content:'';
    width:8px;
    height:8px;
    border-radius:50%;
    display:inline-block;
    margin-right:10px;
    background:#00ff84;
}

h1{
    font-size:72px;
    line-height:0.95;
    font-weight:800;
    max-width:700px;
}

.green{
    color:#00ff84;
}

.subtitle{
    margin-top:25px;
    max-width:500px;
    color:#9c9c9c;
    font-size:20px;
    line-height:1.7;
}

.stats{
    margin-top:50px;
    display:flex;
    gap:20px;
}

.stat{
    padding:24px;
    width:220px;
    border-radius:24px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
}

.stat-value{
    font-size:34px;
    font-weight:800;
}

.stat-label{
    margin-top:8px;
    color:#7d7d7d;
}

/* RIGHT */

.right{
    width:520px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.card{
    width:100%;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(30px);
    border-radius:32px;
    padding:40px;
}

.card h2{
    font-size:36px;
    margin-bottom:10px;
}

.card p{
    color:#888;
    margin-bottom:30px;
}

.telegram-btn{
    width:100%;
    height:60px;
    border:none;
    border-radius:18px;
    background:#00ff84;
    color:black;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.telegram-btn:hover{
    transform:translateY(-2px);
}

.divider{
    text-align:center;
    margin:28px 0;
    color:#666;
    position:relative;
}

.divider:before,
.divider:after{
    content:'';
    position:absolute;
    top:50%;
    width:40%;
    height:1px;
    background:rgba(255,255,255,.08);
}

.divider:before{
    left:0;
}

.divider:after{
    right:0;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:10px;
    color:#aaa;
}

.field input{
    width:100%;
    height:58px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.05);
    background:rgba(255,255,255,.03);
    color:white;
    padding:0 18px;
    font-size:15px;
    outline:none;
}

.field input:focus{
    border-color:#00ff84;
    box-shadow:0 0 20px rgba(0,255,132,.15);
}

.login-btn{
    width:100%;
    height:60px;
    border:none;
    border-radius:18px;
    background:white;
    color:black;
    font-size:16px;
    font-weight:700;
    margin-top:10px;
    cursor:pointer;
}

.bottom{
    text-align:center;
    margin-top:24px;
    color:#777;
}

.bottom a{
    color:#00ff84;
    text-decoration:none;
    font-weight:600;
}

@media(max-width:1200px){

    .left{
        display:none;
    }

    .right{
        width:100%;
    }

}
</style>
</head>
<body>

<div class="wrapper">

<div class="left">

<div class="logo">
Svoy<span>VPN</span>
</div>

<div class="badge">
Работает прямо сейчас
</div>

<h1>
Безопасный доступ
к <span class="green">интернету</span>
</h1>

<div class="subtitle">
Управляйте VPN-подпиской, устройствами,
рефералами, eSIM и настройками аккаунта
из единого кабинета.
</div>

<div class="stats">

<div class="stat">
<div class="stat-value">50k+</div>
<div class="stat-label">Активных пользователей</div>
</div>

<div class="stat">
<div class="stat-value">99.98%</div>
<div class="stat-label">Uptime сети</div>
</div>

<div class="stat">
<div class="stat-value">16ms</div>
<div class="stat-label">Frankfurt</div>
</div>

</div>

</div>

<div class="right">

<div class="card">

<h2>Вход в аккаунт</h2>

<p>
Используйте Telegram или Email
</p>

<button class="telegram-btn">
Войти через Telegram
</button>

<div class="divider">
или
</div>

<div class="field">
<label>Email</label>
<input type="email" placeholder="you@example.com">
</div>

<div class="field">
<label>Пароль</label>
<input type="password" placeholder="Введите пароль">
</div>

<button class="login-btn">
Войти
</button>

<div class="bottom">
Нет аккаунта?
<a href="#">Создать</a>
</div>

</div>

</div>

</div>

</body>
</html>
